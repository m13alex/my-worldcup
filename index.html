<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>My Worldcup</title>
<style>
:root{
  --bg:#070a10; --bg2:#121a26; --bg3:#1b2533; --line:#2b3645; --line2:#39455733;
  --tx:#f1f6fb; --tx2:#8a98ab; --tx3:#5d6b7e;
  --acc:#34d399; --acc-d:#10b981; --acc2:#22d3ee; --vio:#818cf8;
  --warn:#fbbf24; --red:#fb7185; --gold:#fbbf24; --gold2:#f59e0b;
  --g-main:linear-gradient(135deg,#34d399 0%,#22d3ee 60%,#38bdf8 100%);
  --g-blue:linear-gradient(135deg,#22d3ee,#818cf8);
  --g-gold:linear-gradient(135deg,#fde68a,#fbbf24 45%,#f59e0b);
  --glass:rgba(18,26,38,.66);
  --shadow:0 8px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.35);
  --inset:inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(900px 420px at 18% -8%, rgba(52,211,153,.16), transparent 60%),
    radial-gradient(820px 420px at 92% -4%, rgba(129,140,248,.16), transparent 62%),
    radial-gradient(1100px 600px at 50% 6%, rgba(34,211,238,.06), transparent 60%),
    var(--bg);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(circle at 50% 10%,#000,transparent 78%);-webkit-mask-image:radial-gradient(circle at 50% 10%,#000,transparent 78%);}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 12px 130px;min-height:100vh;animation:viewIn .3s cubic-bezier(.2,.7,.2,1) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.4);}70%{transform:scale(.94);}100%{transform:scale(1);}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
@keyframes sweep{from{transform:translateX(-120%) skewX(-18deg);}to{transform:translateX(220%) skewX(-18deg);}}
@keyframes blink{50%{opacity:.32;}}
@keyframes confettiFall{0%{transform:translateY(-12vh) rotate(0);opacity:1;}100%{transform:translateY(108vh) rotate(740deg);opacity:.65;}}
@keyframes screenPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,0);}50%{box-shadow:0 0 0 1px rgba(251,113,133,.5),0 0 34px rgba(251,113,133,.28);}}
@keyframes ringPulseRed{0%,100%{filter:drop-shadow(0 0 0 rgba(251,113,133,0));}50%{filter:drop-shadow(0 0 11px rgba(251,113,133,.65));}}
@keyframes addedPop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes burstSpin{to{transform:rotate(360deg);}}
@keyframes cupFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-9px) rotate(3deg);}}
@keyframes shine{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.18);}50%{box-shadow:0 0 26px 2px rgba(251,191,36,.30);}}
h1{font-size:24px;margin:6px 0 16px;font-weight:850;letter-spacing:-.5px;}
h1 .grad{background:var(--g-main);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(52,211,153,.22));}
h2{margin:20px 0 10px;color:var(--tx2);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:11.5px;}
.row{display:flex;align-items:center;gap:8px;}
.grow{flex:1;min-width:0;}
.muted{color:var(--tx2);font-size:13px;}
.card{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow),var(--inset);
  animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both;overflow:hidden;}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.14),transparent 42%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7;}
.card.tap{cursor:pointer;transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .2s;}
.card.tap:active{transform:scale(.985);border-color:var(--acc2);}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(27,37,51,.85);color:var(--tx);
  border:1px solid var(--line);border-radius:13px;padding:12px 16px;font-size:15px;font-weight:750;cursor:pointer;user-select:none;overflow:hidden;
  transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s;}
.btn::after{content:"";position:absolute;top:0;left:0;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);opacity:0;}
.btn:active::after{opacity:1;animation:sweep .6s ease;}
.btn:active{transform:scale(.96);opacity:.95;}
.btn.primary{background:var(--g-main);border:none;color:#03130d;box-shadow:0 6px 20px rgba(52,211,153,.38);}
.btn.blue{background:var(--g-blue);border:none;color:#04121f;box-shadow:0 6px 20px rgba(99,179,237,.34);}
.btn.gold{background:var(--g-gold);border:none;color:#2a1d02;box-shadow:0 6px 20px rgba(245,158,11,.36);}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red);}
.btn.small{padding:8px 13px;font-size:13px;border-radius:11px;}
.btn.wide{width:100%;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 14px;border-radius:22px;border:1px solid var(--line);background:rgba(18,26,38,.7);font-size:14px;
  font-weight:650;cursor:pointer;transition:all .18s cubic-bezier(.2,.8,.2,1);}
.chip.on{background:var(--g-blue);border-color:transparent;color:#04121f;box-shadow:0 4px 14px rgba(99,179,237,.32);}
.chip.dis{opacity:.3;pointer-events:none;}
.tag{font-size:11px;font-weight:850;padding:2px 8px;border-radius:8px;background:var(--bg3);color:var(--tx2);letter-spacing:.3px;}
.tag.gold{background:var(--g-gold);color:#2a1d02;}
.tag.green{background:var(--g-main);color:#04130d;}
.tlogo{width:20px;height:20px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.tcolor{width:18px;height:18px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:850;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.25);}
.ava{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:top center;flex:none;background:var(--bg3);
  border:1.5px solid rgba(255,255,255,.16);box-shadow:0 2px 6px rgba(0,0,0,.4);}
.avi{width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:850;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);border:1.5px solid rgba(255,255,255,.16);box-shadow:0 2px 6px rgba(0,0,0,.4);}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
th{color:var(--tx2);font-weight:700;text-align:center;padding:6px 4px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
td{padding:9px 4px;text-align:center;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums;}
td.tname,th.tname{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tr.qual td{background:linear-gradient(90deg,rgba(52,211,153,.10),rgba(52,211,153,.015));}
tr.qual td:first-child{position:relative;}
tr.qual td:first-child::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 8px rgba(52,211,153,.5);}
.tabs{display:flex;gap:4px;background:rgba(13,19,28,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:5px;border-radius:15px;
  margin:11px 0;position:sticky;top:6px;z-index:5;border:1px solid var(--line);box-shadow:var(--inset);}
.tab{flex:1;text-align:center;padding:10px 2px;border-radius:11px;font-size:13px;font-weight:750;color:var(--tx2);cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.2,1);}
.tab.on{background:var(--g-main);color:#04130d;box-shadow:0 4px 12px rgba(52,211,153,.3);}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:11px 8px;border-top:1px solid var(--line2);
  font-size:14.5px;cursor:pointer;transition:background .16s;border-radius:12px;}
.mrow:first-child{border-top:none;}
.mrow:active{background:rgba(255,255,255,.04);}
.mrow.managed{box-shadow:inset 3px 0 0 var(--acc2);}
.mrow .mid{display:flex;flex-direction:column;align-items:center;gap:6px;}
.mrow .score{font-weight:850;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.05);
  border-radius:9px;padding:4px 11px;min-width:54px;line-height:1.15;}
.mrow .side{display:flex;align-items:center;gap:7px;overflow:hidden;}
.mrow .side span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.mrow .side.r{justify-content:flex-end;}
.simbtn{height:25px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:rgba(27,37,51,.85);color:var(--warn);
  font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,box-shadow .2s,border-color .2s;}
.simbtn:active{transform:scale(.9);box-shadow:0 0 12px rgba(251,191,36,.3);border-color:var(--warn);}
.livebox{border-radius:22px;padding:8px 4px 6px;transition:box-shadow .3s;}
.livebox.ending{animation:screenPulse 1.1s ease-in-out infinite;}
.live-score{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px;}
.live-score .num{font-size:58px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;transition:transform .25s;
  background:var(--g-main);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 20px rgba(52,211,153,.28));}
.live-score .num.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1);}
.live-score .sep{font-size:34px;color:var(--tx3);font-weight:200;}
.live-team{flex:1;text-align:center;font-size:13px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:7px;overflow:hidden;}
.live-team .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.live-team .tlogo{width:44px;height:44px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));}
.live-team .tcolor{width:44px;height:44px;font-size:16px;}
.timer{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 6px;}
.timer .ring{position:relative;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--acc) calc(var(--p,0)*1%),rgba(255,255,255,.07) 0);transition:background .4s linear;}
.timer .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg);}
.timer .ring.ending{background:conic-gradient(var(--red) calc(var(--p,0)*1%),rgba(251,113,133,.14) 0);animation:ringPulseRed 1.1s infinite;}
.timer .t{position:relative;font-size:25px;font-weight:850;font-variant-numeric:tabular-nums;}
.timer .t .ap{font-size:14px;}
.timer .t .added{color:var(--red);font-weight:850;animation:addedPop .3s ease both;}
.timer .t.ending{color:var(--red);}
.timer .t.over{color:var(--red);animation:blink 1s infinite;}
.timer .vm{font-size:14px;color:var(--tx2);min-width:48px;font-variant-numeric:tabular-nums;}
.timer .vm.ending{color:var(--red);}
.tbtn{width:54px;height:54px;border-radius:50%;border:none;background:var(--g-main);color:#03130d;font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;box-shadow:0 8px 22px rgba(52,211,153,.42);}
.tbtn:active{transform:scale(.92);}
.tbtn.paused{background:var(--bg3);color:var(--tx);border:1px solid var(--line);box-shadow:none;}
.cols{display:flex;gap:9px;margin-top:11px;}
.col{flex:1;min-width:0;}
.colhead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--tx2);padding:4px 2px 8px;justify-content:center;}
.pbtn{display:flex;align-items:center;gap:8px;width:100%;background:rgba(18,26,38,.7);border:1px solid var(--line);border-radius:12px;
  padding:8px 9px;margin-bottom:6px;cursor:pointer;color:var(--tx);font-size:13px;text-align:left;transition:transform .1s,border-color .16s,background .16s;}
.pbtn:active{transform:scale(.97);border-color:var(--acc);background:rgba(52,211,153,.06);}
.pbtn .num{font-weight:850;font-size:12px;color:var(--tx2);min-width:20px;text-align:center;flex:none;}
.pbtn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.pbtn .pos{font-size:9px;color:var(--tx3);flex:none;font-weight:800;}
.lineup-sec{font-size:10px;font-weight:850;color:var(--acc2);text-transform:uppercase;letter-spacing:.6px;padding:7px 2px 5px;text-align:center;}
.lineup-sec.sub{color:var(--tx3);border-top:1px dashed var(--line2);margin-top:6px;}
.pbtn.bench{opacity:.62;cursor:default;}
.feed{max-height:150px;overflow-y:auto;margin:8px 0;}
.fitem{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 10px;border-radius:11px;background:rgba(18,26,38,.7);
  border:1px solid var(--line2);margin-bottom:5px;animation:fadeUp .25s ease both;}
.fitem .min{font-weight:850;color:var(--acc2);min-width:30px;font-variant-numeric:tabular-nums;}
.fitem .ball{font-size:13px;opacity:.85;}
.fitem .ava,.fitem .avi{width:24px;height:24px;font-size:9px;}
.fitem .del{color:var(--red);font-size:16px;padding:0 4px;cursor:pointer;margin-left:auto;}
.overlay{position:fixed;inset:0;background:rgba(2,6,12,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:linear-gradient(180deg,#161d28,#10151d);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:none;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:sheetUp .26s cubic-bezier(.2,.8,.2,1) both;}
.sheet h3{margin:0 0 12px;font-size:17px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.bwrap{overflow-x:auto;padding-bottom:10px;}
.bcols{display:flex;gap:12px;min-width:max-content;}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:165px;}
.btie{position:relative;background:rgba(18,26,38,.7);border:1px solid var(--line);border-radius:13px;padding:9px;font-size:12.5px;cursor:pointer;
  transition:border-color .15s,box-shadow .2s;box-shadow:var(--inset);animation:fadeUp .3s ease both;}
.btie:active{border-color:var(--acc2);box-shadow:0 0 0 1px rgba(34,211,238,.2);}
.btie .trow{display:flex;align-items:center;gap:5px;padding:3px 2px;}
.btie .trow.win{font-weight:850;}
.btie .trow.lose{opacity:.42;}
.btie .sc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
.btie .tlogo{width:16px;height:16px;}
.btie .tcolor{width:16px;height:16px;font-size:8px;}
.bhead{font-size:11px;color:var(--tx2);text-align:center;font-weight:850;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;}
.champ{position:relative;border-radius:22px;padding:26px 16px 22px;text-align:center;margin-bottom:11px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% -10%,rgba(251,191,36,.20),transparent 55%),linear-gradient(180deg,#241c08,#16110a);
  border:1px solid #6b5618;box-shadow:0 12px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,235,170,.16);animation:glowPulse 3.4s infinite,fadeUp .4s ease both;}
.champ::before{content:"";position:absolute;top:-60%;left:50%;width:420px;height:420px;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 0deg,transparent,rgba(251,191,36,.15),transparent 30%,rgba(251,191,36,.15),transparent 60%);animation:burstSpin 15s linear infinite;}
.champ .lbl{position:relative;font-size:11px;font-weight:850;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin:0;}
.champ .cup{position:relative;font-size:52px;display:inline-block;animation:cupFloat 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 18px rgba(245,158,11,.5));margin:4px 0;}
.champ .cname{position:relative;font-size:25px;font-weight:900;letter-spacing:-.4px;margin:2px 0;
  background:linear-gradient(90deg,#fff,#fde68a,#fff,#fbbf24,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.6s linear infinite;}
.champ .sub{position:relative;color:#d8c388;font-size:13px;font-weight:600;}
.champ .mvp{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 13px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid #6b5618;font-size:13px;font-weight:700;}
input[type=text]{background:var(--bg3);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:15px;width:100%;}
input[type=text]:focus{outline:none;border-color:var(--acc2);}
.step{display:flex;align-items:center;gap:14px;}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg3);color:var(--tx);font-size:20px;cursor:pointer;}
.step .v{font-size:21px;font-weight:850;min-width:34px;text-align:center;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);color:var(--tx);
  padding:11px 18px;border-radius:13px;font-size:14px;z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.55);white-space:nowrap;animation:fadeUp .25s ease both;}
.fab{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;box-shadow:0 8px 24px rgba(16,185,129,.38);padding:14px 26px;font-size:16px;border-radius:16px;}
.empty{text-align:center;color:var(--tx2);padding:44px 16px;font-size:14px;}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.back{font-size:26px;padding:4px 10px 4px 0;cursor:pointer;color:var(--tx2);transition:color .15s;}
.back:active{color:var(--tx);}
.sec{margin-bottom:18px;}
.lbl,.sec .lbl{font-size:12px;font-weight:800;color:var(--tx2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px;}
.err{color:var(--red);font-size:13px;margin-top:8px;}
.gname{font-size:13px;font-weight:850;color:var(--acc2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
.mvpitem{display:flex;align-items:center;gap:9px;width:100%;background:rgba(18,26,38,.7);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;margin-bottom:6px;cursor:pointer;color:var(--tx);font-size:14px;text-align:left;transition:border-color .15s;}
.mvpitem:active{border-color:var(--gold);}
.confetti{position:fixed;top:0;width:9px;height:15px;z-index:200;pointer-events:none;border-radius:2px;animation:confettiFall linear both;}
.sclub{display:flex;align-items:center;gap:4px;margin-top:1px;}
.sclub .tlogo,.sclub .tcolor{width:13px;height:13px;font-size:7px;}
.btie-sim{margin-top:7px;text-align:center;font-size:11px;font-weight:850;color:var(--warn);border:1px solid var(--line);border-radius:8px;padding:5px 0;background:rgba(251,191,36,.07);transition:transform .1s,box-shadow .2s;}
.btie-sim:active{transform:scale(.95);box-shadow:0 0 12px rgba(251,191,36,.3);}
.commentary{font-size:11px;color:var(--acc2);opacity:.92;margin-top:1px;font-style:italic;}
.cardbox{width:24px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
.fitem.ev-chance{opacity:.8;padding-top:5px;padding-bottom:5px;}
.fitem.ev-card .min{color:var(--warn);}

function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
/* стабильный «талант» игрока 0.65–1.9 — одни и те же игроки стабильно результативнее */
function skillOf(p){ return 0.65 + (hashStr(p.name+'#'+p.n)%1000)/1000*1.25; }
function virtLen(t){ return t.sport==='hockey'?60:90; } // виртуальная длительность для минут событий
function addedTimeOf(t, m){ if(!t || t.sport==='hockey' || !t.config || t.config.matchMode.type!=='time') return 0; if(m.addedTime==null) m.addedTime=1+rnd(8); return m.addedTime; }
function matchVend(t, m){ return virtLen(t) + addedTimeOf(t,m); }
function sampleMinutes(k, lo, hi){
  const out=[]; if(k<=0) return out;
  if(hi<lo) hi=lo;
  const range=hi-lo+1;
  if(k>=range){ for(let i=0;i<k;i++) out.push(lo+rnd(range)); }
  else { const used=new Set(); while(out.length<k){ const v=lo+rnd(range); if(!used.has(v)){ used.add(v); out.push(v); } } }
  return out.sort((a,b)=>a-b);
}

/* --- Berger round-robin: returns array of rounds, each round = [[homeIdx, awayIdx], ...] --- */
function berger(n){
  const ids=[...Array(n).keys()];
  const odd = n%2===1;
  if(odd) ids.push(-1); // bye
  const m=ids.length, half=m/2, rounds=[];
  let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const round=[];
    for(let i=0;i<half;i++){
      const a=arr[i], b=arr[m-1-i];
      if(a===-1||b===-1) continue;
      if(r%2===0) round.push(i===0? [a,b] : (i%2? [b,a]:[a,b]));
      else round.push(i===0? [b,a] : (i%2? [a,b]:[b,a]));
    }
    rounds.push(round);
    arr=[arr[0], ...arr.slice(2), arr[1]];
  }
  return rounds;
}

/* --- Group draw. teams: array of team objects. Returns array of arrays of team ids --- */
function drawGroups(teams, numGroups, seeding){
  const g=[...Array(numGroups)].map(()=>[]);
  if(seeding==='random'){
    shuffle(teams).forEach((t,i)=>g[i%numGroups].push(t.id));
  } else {
    const sorted=teams.slice().sort((a,b)=>b.rating-a.rating);
    const potSize=numGroups;
    const gc=g.map(()=>new Set());
    for(let p=0;p*potSize<sorted.length;p++){
      const pot=shuffle(sorted.slice(p*potSize,(p+1)*potSize));
      pot.forEach(tm=>{
        const cand=[]; for(let gi=0;gi<numGroups;gi++){ if(g[gi].length===p) cand.push(gi); }
        const ok=cand.filter(gi=>!gc[gi].has(tm.country));
        const pick=(ok.length?ok:cand)[0];
        g[pick].push(tm.id); gc[pick].add(tm.country);
      });
    }
  }
  return g;
}

/* --- Generate group/league matches. rounds: 1 or 2 --- */
function genRoundRobin(teamIds, rounds, stage, groupName){
  const out=[]; const sched=berger(teamIds.length);
  sched.forEach((round,ri)=>{
    round.forEach(([h,a])=>{
      out.push(mkMatch(teamIds[h],teamIds[a],stage,{group:groupName,round:ri+1}));
    });
  });
  if(rounds===2){
    sched.forEach((round,ri)=>{
      round.forEach(([h,a])=>{
        out.push(mkMatch(teamIds[a],teamIds[h],stage,{group:groupName,round:sched.length+ri+1}));
      });
    });
  }
  return out;
}

function mkMatch(home,away,stage,extra){
  return Object.assign({
    id:uid(), home, away, stage, status:'scheduled',
    gh:0, ga:0, events:[], result:null, // result: 'REG'|'OT'|'SO'|'PEN'
    penWinner:null, mvp:null,
  }, extra||{});
}

/* --- Standings. sport: 'football'|'hockey' --- */
function computeTable(teamIds, matches, sport){
  const rows={};
  teamIds.forEach(id=>rows[id]={team:id,gp:0,w:0,d:0,l:0,otw:0,otl:0,gf:0,ga:0,pts:0});
  matches.filter(m=>m.status==='done').forEach(m=>{
    const h=rows[m.home], a=rows[m.away]; if(!h||!a) return;
    h.gp++; a.gp++; h.gf+=m.gh; h.ga+=m.ga; a.gf+=m.ga; a.ga+=m.gh;
    let hw = m.gh>m.ga, aw = m.ga>m.gh;
    if(m.gh===m.ga && (m.result==='SO'||m.result==='PEN') && m.penWinner){ hw = m.penWinner===m.home; aw=!hw; }
    if(sport==='hockey'){
      const ot = m.result==='OT'||m.result==='SO';
      if(hw){ h.w++; h.pts+=2; a.l++; if(ot){a.otl++; a.pts+=1;} }
      else if(aw){ a.w++; a.pts+=2; h.l++; if(ot){h.otl++; h.pts+=1;} }
      else { h.d++; a.d++; h.pts++; a.pts++; }
    } else {
      if(hw){ h.w++; h.pts+=3; a.l++; }
      else if(aw){ a.w++; a.pts+=3; h.l++; }
      else { h.d++; a.d++; h.pts++; a.pts++; }
    }
  });
  const list=Object.values(rows);
  function h2hPts(idA, ids){
    let p=0;
    matches.filter(m=>m.status==='done' && ids.includes(m.home)&&ids.includes(m.away)).forEach(m=>{
      if(m.home!==idA && m.away!==idA) return;
      const isHome=m.home===idA;
      const my=isHome?m.gh:m.ga, op=isHome?m.ga:m.gh;
      const win=sport==='hockey'?2:3;
      if(my>op) p+=win;
      else if(my===op){
        if(m.penWinner) p+= (m.penWinner===idA? win : (sport==='hockey'?1:0));
        else p+=1;
      }
      else if(sport==='hockey' && (m.result==='OT'||m.result==='SO')) p+=1;
    });
    return p;
  }
  const snap=list.slice();
  list.sort((x,y)=>{
    if(y.pts!==x.pts) return y.pts-x.pts;
    const dx=x.gf-x.ga, dy=y.gf-y.ga;
    if(dy!==dx) return dy-dx;
    if(y.gf!==x.gf) return y.gf-x.gf;
    const tied=snap.filter(r=>r.pts===x.pts && (r.gf-r.ga)===dx && r.gf===x.gf).map(r=>r.team);
    if(tied.length>1){
      const hx=h2hPts(x.team,tied), hy=h2hPts(y.team,tied);
      if(hy!==hx) return hy-hx;
    }
    return 0;
  });
  return list;
}

/* --- Bracket seeding order --- */
function seedPairs(n){
  let order=[1];
  while(order.length<n){
    const len=order.length*2, next=[];
    order.forEach(s=>{ next.push(s, len+1-s); });
    order=next;
  }
  const pairs=[];
  for(let i=0;i<n;i+=2) pairs.push([order[i],order[i+1]]);
  return pairs;
}

/* --- Build playoff bracket from ordered seed list of team ids --- */
function buildBracket(seedTeams, twoLeg){
  const n=seedTeams.length;
  const numRounds=Math.log2(n);
  const ties=[];
  const pairs=seedPairs(n);
  pairs.forEach((p,idx)=>{
    ties.push({ id:uid(), round:0, idx, home:seedTeams[p[0]-1]||null, away:seedTeams[p[1]-1]||null, winner:null, matches:[] });
  });
  for(let r=1;r<numRounds;r++){
    const cnt=n/Math.pow(2,r+1);
    for(let i=0;i<cnt;i++) ties.push({ id:uid(), round:r, idx:i, home:null, away:null, winner:null, matches:[] });
  }
  return { ties, numRounds, twoLeg };
}

function roundName(round, numRounds, sport){
  const left=numRounds-round;
  if(left===1) return 'Финал';
  if(left===2) return '1/2 финала';
  if(left===3) return '1/4 финала';
  if(left===4) return '1/8 финала';
  return '1/'+Math.pow(2,left-1)+' финала';
}

/* --- Create matches for a tie --- */
function genTieMatches(t, tie){
  const isFinal = tie.round===t.bracket.numRounds-1;
  const twoLeg = t.bracket.twoLeg && !isFinal;
  const ms=[];
  if(twoLeg){
    ms.push(mkMatch(tie.away,tie.home,'po',{tieId:tie.id,leg:1,rn:roundName(tie.round,t.bracket.numRounds)}));
    ms.push(mkMatch(tie.home,tie.away,'po',{tieId:tie.id,leg:2,rn:roundName(tie.round,t.bracket.numRounds)}));
  } else {
    ms.push(mkMatch(tie.home,tie.away,'po',{tieId:tie.id,leg:1,rn:roundName(tie.round,t.bracket.numRounds)}));
  }
  tie.matches=ms.map(m=>m.id);
  t.matches.push(...ms);
}

/* --- Determine tie winner --- */
function tieWinner(t, tie){
  const legs=tie.matches.map(id=>t.matches.find(m=>m.id===id));
  if(!legs.length || legs.some(m=>!m||m.status!=='done')) return null;
  if(legs.length===1){
    const m=legs[0];
    if(m.gh>m.ga) return m.home;
    if(m.ga>m.gh) return m.away;
    return m.penWinner||null;
  }
  let aggH=0, aggA=0;
  legs.forEach(m=>{
    const hIsTieHome = m.home===tie.home;
    aggH += hIsTieHome? m.gh : m.ga;
    aggA += hIsTieHome? m.ga : m.gh;
  });
  if(aggH>aggA) return tie.home;
  if(aggA>aggH) return tie.away;
  for(let i=legs.length-1;i>=0;i--){ if(legs[i].penWinner) return legs[i].penWinner; }
  return null;
}

/* --- Qualifiers from groups --- */
function qualifiers(t){
  const adv=t.config.advance, G=t.groups.length;
  const tables=t.groups.map(g=>computeTable(g.teams, t.matches.filter(m=>m.stage==='group'&&m.group===g.name), t.sport));
  if(adv===2 && G>=2 && G%2===0){
    const w=tables.map(tb=>(tb[0]||{}).team), ru=tables.map(tb=>(tb[1]||tb[0]||{}).team);
    const list=[];
    for(let i=0;i<G;i+=2){ list.push([w[i],ru[i+1]]); list.push([w[i+1],ru[i]]); }
    const firstHalf=list.filter((_,i)=>i%2===0), secondHalf=list.filter((_,i)=>i%2===1);
    return { mode:'pairs', pairs:[...firstHalf,...secondHalf] };
  }
  const ratingOf=id=>{ const x=t.teams.find(x=>x.id===id); return x?x.rating:0; };
  const all=[];
  tables.forEach(tb=>tb.slice(0,adv).forEach((row,place)=>all.push({...row,place})));
  all.sort((x,y)=> x.place-y.place || y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf || ratingOf(y.team)-ratingOf(x.team));
  return { mode:'seeds', seeds: all.map(r=>r.team) };
}

/* --- Start playoff stage --- */
function startPlayoff(t){
  const q=qualifiers(t);
  let bracket;
  if(q.mode==='pairs'){
    const n=q.pairs.length*2;
    bracket=buildBracket([...Array(n)].map(()=>null), t.config.twoLeg);
    q.pairs.forEach((p,idx)=>{ bracket.ties[idx].home=p[0]; bracket.ties[idx].away=p[1]; });
  } else {
    bracket=buildBracket(q.seeds, t.config.twoLeg);
  }
  t.bracket=bracket;
  t.stage='po';
  bracket.ties.filter(x=>x.round===0).forEach(tie=>genTieMatches(t,tie));
}

/* --- After a match is finished: propagate --- */
function onMatchDone(t, match){
  updateElo(t,match);
  if(match.stage==='group'){
    const groupDone = t.matches.filter(m=>m.stage==='group').every(m=>m.status==='done');
    if(groupDone && t.config.format==='groups' && !t.bracket) startPlayoff(t);
    if(groupDone && t.config.format==='league'){ t.status='finished'; t.champion=computeTable(t.groups[0].teams,t.matches,t.sport)[0].team; t.finishedAt=Date.now(); }
    return;
  }
  const tie=t.bracket.ties.find(x=>x.id===match.tieId);
  const w=tieWinner(t,tie);
  if(!w) return;
  tie.winner=w;
  const numRounds=t.bracket.numRounds;
  if(tie.round===numRounds-1){
    t.status='finished'; t.champion=w; t.runnerUp= w===tie.home? tie.away: tie.home; t.finishedAt=Date.now();
    return;
  }
  const next=t.bracket.ties.find(x=>x.round===tie.round+1 && x.idx===Math.floor(tie.idx/2));
  if(tie.idx%2===0) next.home=w; else next.away=w;
  if(next.home&&next.away&&next.matches.length===0) genTieMatches(t,next);
}

/* --- needs deciding shootout? --- */
function needsDecider(t, match){
  if(match.status==='done') return false;
  if(match.stage==='group') return t.sport==='hockey' && match.gh===match.ga;
  const tie=t.bracket.ties.find(x=>x.id===match.tieId);
  if(tie.matches.length===2){
    const other=t.matches.find(m=>m.id===(tie.matches[0]===match.id? tie.matches[1]: tie.matches[0]));
    if(!other || other.status!=='done') return false; // другой матч серии не сыгран — ничья допустима
    let aggH=0,aggA=0;
    [other,match].forEach(m=>{ const hh=m.home===tie.home; aggH+=hh?m.gh:m.ga; aggA+=hh?m.ga:m.gh; });
    return aggH===aggA;
  }
  return match.gh===match.ga;
}

/* --- Simulation --- */
function poisson(lambda){
  const L=Math.exp(-lambda); let k=0,p=1;
  do{ k++; p*=Math.random(); }while(p>L);
  return k-1;
}
function ratingOf(t, team){ return team.rating + ((t.elo&&t.elo[team.id])||0); }
function tacticOf(t, id){ return (t.tactic&&t.tactic[id])||'bal'; }
const TAC_ATK={att:1.18,bal:1,def:0.83};
const TAC_DEF={att:1.14,bal:1,def:0.80};
function tacticIcon(t,id){ const x=tacticOf(t,id); return x==='att'?'⚔️':x==='def'?'🛡️':'⚖️'; }
function tacticName(x){ return x==='att'?'Атакующая':x==='def'?'Оборонительная':'Сбалансированная'; }
function updateElo(t,m){
  if(!t.elo) t.elo={};
  if(m.eloDelta!=null){ t.elo[m.home]=(t.elo[m.home]||0)-m.eloDelta; t.elo[m.away]=(t.elo[m.away]||0)+m.eloDelta; }
  const ra=ratingOf(t,team(t,m.home)), rb=ratingOf(t,team(t,m.away));
  const exp=1/(1+Math.pow(10,(rb-ra)/200));
  const res = m.gh>m.ga?1 : m.gh<m.ga?0 : (m.penWinner? (m.penWinner===m.home?0.72:0.28) : 0.5);
  const d=4*(res-exp);
  t.elo[m.home]=(t.elo[m.home]||0)+d;
  t.elo[m.away]=(t.elo[m.away]||0)-d;
  m.eloDelta=d;
}
function expGoals(t, ra, rb){
  const base = t.sport==='hockey'? 2.7 : 1.35;
  const diff=ra-rb;
  return Math.max(0.25, Math.min(6, base*Math.pow(10, diff/120)));
}
/* Реалистичные веса результативности по амплуа (доли голов: НП ~55-65%, ПЗ ~25-30%, ЗЩ ~8-12%) */
function _exc(ex,n){ if(ex==null) return false; if(typeof ex==='number') return ex===n; if(ex.has) return ex.has(n); return false; }
function suspendedFor(t, teamId, matchId){
  const seq=(t.matches||[]).filter(m=>m.home===teamId||m.away===teamId);
  let pending=new Set(); const yc={};
  for(const m of seq){
    const cur=new Set(pending);
    if(m.id===matchId) return cur;
    pending=new Set();
    if(m.status!=='done') continue;
    (m.events||[]).forEach(e=>{ if(e.team!==teamId) return;
      if(e.type==='rc'){ pending.add(e.pl); }
      else if(e.type==='yc'){ yc[e.pl]=(yc[e.pl]||0)+1; if(yc[e.pl]%2===0) pending.add(e.pl); } });
  }
  return new Set(pending);
}
function ensureLineup(t,m){
  if(m.lineup) return m.lineup;
  const form = t.sport==='hockey'? {'ВР':1,'ЗЩ':2,'НП':3} : {'ВР':1,'ЗЩ':4,'ПЗ':3,'НП':3};
  const need=Object.keys(form).reduce((s,k)=>s+form[k],0);
  function build(teamId){
    const tm=team(t,teamId); const sus=suspendedFor(t,teamId,m.id);
    const avail=tm.players.filter(p=>!sus.has(p.n));
    const xi=[]; const used=new Set();
    Object.keys(form).forEach(pos=>{ const cnt=form[pos];
      avail.filter(p=>p.pos===pos && !used.has(p.n)).sort((a,b)=>skillOf(b)-skillOf(a)).slice(0,cnt)
        .forEach(p=>{ xi.push(p.n); used.add(p.n); }); });
    if(xi.length<need){ avail.filter(p=>!used.has(p.n)).sort((a,b)=>skillOf(b)-skillOf(a))
        .forEach(p=>{ if(xi.length<need){ xi.push(p.n); used.add(p.n); } }); }
    const bench=tm.players.filter(p=>!used.has(p.n) && !sus.has(p.n)).map(p=>p.n);
    return {xi, bench};
  }
  m.lineup={ home: build(m.home), away: build(m.away) };
  return m.lineup;
}
function pickScorer(t, team, exclude){
  const W = t.sport==='hockey'
    ? {'НП':9,'ЗЩ':1.8,'ВР':0.01}
    : {'НП':12,'ПЗ':4.2,'ЗЩ':1.1,'ВР':0.02};
  const ws=team.players.map(p=>_exc(exclude,p.n)?0:(W[p.pos]||1)*skillOf(p));
  const tot=ws.reduce((s,w)=>s+w,0);
  let r=Math.random()*tot;
  for(let i=0;i<team.players.length;i++){ r-=ws[i]; if(r<=0) return team.players[i]; }
  return team.players[team.players.length-1];
}
function pickAssist(t, team, scorer, exclude){
  const noAssist = t.sport==='hockey'? 0.15 : 0.25;
  if(Math.random()<noAssist) return null;
  const W = t.sport==='hockey'
    ? {'НП':5,'ЗЩ':2.6,'ВР':0.05}
    : {'ПЗ':5,'НП':3,'ЗЩ':1.6,'ВР':0.1};
  const cand=team.players.filter(p=>p.n!==scorer.n && !_exc(exclude,p.n));
  const ws=cand.map(p=>(W[p.pos]||1)*skillOf(p));
  const tot=ws.reduce((s,w)=>s+w,0);
  let r=Math.random()*tot;
  for(let i=0;i<cand.length;i++){ r-=ws[i]; if(r<=0) return cand[i]; }
  return null;
}
function pickCardPlayer(tm, ex){ const av=tm.players.filter(p=>!_exc(ex,p.n)); const a=av.length?av:tm.players; return a[rnd(a.length)].n; }
function mkEvent(t, team, min, ot, exclude){
  const sc=pickScorer(t,team,exclude), as=pickAssist(t,team,sc,exclude);
  const e={team:team.id, scorer:sc.n, assist:as?as.n:null, min:min};
  if(ot) e.ot=true;
  return e;
}
/* MVP матча автоматически: вклад 2×гол + 1×пас, приоритет команде-победителю; при 0:0 — вратарь победителя */
function autoMVP(t, match){
  if(match.mvp) return;
  const winner = match.gh>match.ga? match.home : match.ga>match.gh? match.away : match.penWinner;
  const contrib={};
  match.events.forEach(e=>{
    if(e.scorer!=null){ const k=e.team+'#'+e.scorer; contrib[k]=(contrib[k]||0)+2; }
    if(e.assist!=null){ const k=e.team+'#'+e.assist; contrib[k]=(contrib[k]||0)+1; }
  });
  let best=null, bestScore=-1;
  Object.entries(contrib).forEach(([k,v])=>{
    const [team,n]=k.split('#');
    const score=v + (team===winner?1.5:0) + Math.random()*0.5;
    if(score>bestScore){ bestScore=score; best={team, n:+n}; }
  });
  if(!best){
    const tid = winner || (Math.random()<0.5? match.home: match.away);
    const wt=t.teams.find(x=>x.id===tid);
    const gk=wt.players.find(p=>p.pos==='ВР')||wt.players[0];
    best={team:tid, n:gk.n};
  }
  if(best) match.mvp={team:best.team, n:best.n, auto:true};
}
/* MVP турнира: 2×гол + 1×пас + 3×MVP матча (вычисляется по факту, всегда актуален) */
function tournamentMVP(t){
  const sc={};
  t.matches.forEach(m=>{
    if(m.status!=='done') return;
    m.events.forEach(e=>{
      if(e.scorer!=null){ const k=e.team+'#'+e.scorer; sc[k]=(sc[k]||0)+2; }
      if(e.assist!=null){ const k=e.team+'#'+e.assist; sc[k]=(sc[k]||0)+1; }
    });
    if(m.mvp){ const k=m.mvp.team+'#'+m.mvp.n; sc[k]=(sc[k]||0)+3; }
  });
  let best=null, bestV=-1;
  Object.entries(sc).forEach(([k,v])=>{ if(v>bestV){ bestV=v; const [team,n]=k.split('#'); best={team, n:+n, score:v}; } });
  return best;
}
/* Симуляция. fromCurrent=true — доигрывает матч с текущего счёта/минуты, сохраняя забитые голы */
function simulateMatch(t, match, fromCurrent){
  const home=t.teams.find(x=>x.id===match.home), away=t.teams.find(x=>x.id===match.away);
  const tH=tacticOf(t,home.id), tA=tacticOf(t,away.id);
  const eh=expGoals(t,ratingOf(t,home),ratingOf(t,away))*1.12*TAC_ATK[tH]*TAC_DEF[tA], ea=expGoals(t,ratingOf(t,away),ratingOf(t,home))*TAC_ATK[tA]*TAC_DEF[tH];
  const mm=t.config.matchMode, V=virtLen(t);
  if(!fromCurrent){ match.events=[]; match.gh=0; match.ga=0; match.mvp=null; }
  const wasOT=fromCurrent && match.otPending;
  match.otPending=false;
  if(wasOT){ // матч уже в овертайме — разыгрываем только победный гол
    const w=Math.random()<eh/(eh+ea)?'h':'a';
    const team=w==='h'?home:away;
    if(w==='h')match.gh++; else match.ga++;
    match.events.push(mkEvent(t, team, V+1+rnd(t.sport==='hockey'?5:30), true));
    match.result='OT'; match.status='done'; match.timerRunning=false; match.timerStartedAt=null;
    genStats(t,match); autoMVP(t,match); onMatchDone(t,match); return;
  }
  const gh0=match.gh, ga0=match.ga;
  let startMin=0;
  if(fromCurrent){
    if(mm.type==='time'){ const lim=mm.minutes*60;
      const el=(match.timerElapsed||0)+(match.timerRunning&&match.timerStartedAt? (Date.now()-match.timerStartedAt)/1000:0);
      startMin=Math.min(V, Math.floor((el/lim)*V)); }
    else startMin=Math.min(V-1, match.virtMin||0);
    match.events.forEach(e=>{ if(e.min!=null && !e.ot && e.min>startMin) startMin=Math.min(e.min,V-1); });
  }
  const _lu=ensureLineup(t,match);
  const susH=new Set(home.players.map(p=>p.n).filter(n=>_lu.home.xi.indexOf(n)<0));
  const susA=new Set(away.players.map(p=>p.n).filter(n=>_lu.away.xi.indexOf(n)<0));
  let addH=0, addA=0, redH=null, redA=null, redHpl=null, redApl=null, injH=null, injHpl=null, injA=null, injApl=null, ehM=1, eaM=1;
  if(mm.type==='time' && !fromCurrent){
    if(Math.random()<0.07){ redH=startMin+1+rnd(Math.max(1,V-startMin)); redHpl=pickCardPlayer(home,susH); const f=Math.max(0,(V-redH)/V); ehM*=(1-0.45*f); eaM*=(1+0.30*f); }
    if(Math.random()<0.07){ redA=startMin+1+rnd(Math.max(1,V-startMin)); redApl=pickCardPlayer(away,susA); const f=Math.max(0,(V-redA)/V); eaM*=(1-0.45*f); ehM*=(1+0.30*f); }
    if(Math.random()<0.06){ injH=startMin+1+rnd(Math.max(1,V-startMin)); injHpl=pickCardPlayer(home,susH); }
    if(Math.random()<0.06){ injA=startMin+1+rnd(Math.max(1,V-startMin)); injApl=pickCardPlayer(away,susA); }
  }
  if(mm.type==='goals'){
    let gh=gh0, ga=ga0; const N=mm.goals;
    while(gh<N && ga<N){ (Math.random()< eh/(eh+ea))? gh++ : ga++; }
    addH=gh-gh0; addA=ga-ga0;
  } else {
    const frac=Math.max(0, 1-startMin/V);
    addH=poisson(eh*ehM*frac); addA=poisson(ea*eaM*frac);
  }
  const Vend=matchVend(t,match);
  const mins=sampleMinutes(addH+addA, startMin+1, Vend);
  const sides=shuffle([...Array(addH).fill('h'),...Array(addA).fill('a')]);
  sides.forEach((s,i)=>{ const mn=mins[i]; const ex=new Set(s==='h'?susH:susA); if(s==='h'&&redHpl!=null&&mn>=redH) ex.add(redHpl); if(s==='a'&&redApl!=null&&mn>=redA) ex.add(redApl); if(s==='h'&&injHpl!=null&&mn>=injH) ex.add(injHpl); if(s==='a'&&injApl!=null&&mn>=injA) ex.add(injApl); match.events.push(mkEvent(t, s==='h'?home:away, mn, false, ex)); });
  if(mm.type==='time'){
    if(redH!=null) match.events.push({team:home.id,type:'rc',pl:redHpl,min:Math.min(redH,Vend)});
    if(redA!=null) match.events.push({team:away.id,type:'rc',pl:redApl,min:Math.min(redA,Vend)});
    const yc=rnd(4);
    for(let k=0;k<yc;k++){ const cm=Math.random()<0.5?home:away; match.events.push({team:cm.id,type:'yc',pl:pickCardPlayer(cm,cm===home?susH:susA),min:startMin+1+rnd(Math.max(1,V-startMin))}); }
    const nch=1+rnd(4);
    for(let k=0;k<nch;k++){ const cm=Math.random()< eh/(eh+ea)?home:away; match.events.push({team:cm.id,type:'chance',pl:pickScorer(t,cm,cm===home?susH:susA).n,min:startMin+1+rnd(Math.max(1,V-startMin)),kind:rnd(4)}); }
    if(t.sport==='hockey'){
      match.events.filter(e=>e.type==='yc'||e.type==='rc').forEach(c=>{ const pr=c.type==='rc'?0.42:0.20; if(Math.random()<pr){ const opp=c.team===home.id?away:home; const ev=mkEvent(t,opp,Math.min(Vend,c.min+1+rnd(3)),false,opp===home?susH:susA); ev.pp=true; match.events.push(ev); if(opp===home)addH++; else addA++; } });
      const cgh=gh0+addH, cga=ga0+addA;
      if(Math.abs(cgh-cga)===1 && Math.random()<0.3){ const lead=cgh>cga?home:away; const ev=mkEvent(t,lead,Math.min(Vend,V-1+rnd(2)),false,lead===home?susH:susA); ev.en=true; match.events.push(ev); if(lead===home)addH++; else addA++; }
    }
    if(injHpl!=null) match.events.push({team:home.id,type:'inj',pl:injHpl,min:Math.min(injH,Vend)});
    if(injApl!=null) match.events.push({team:away.id,type:'inj',pl:injApl,min:Math.min(injA,Vend)});
  }
  match.gh=gh0+addH; match.ga=ga0+addA;
  match.result='REG'; match.virtMin=V; match.timerRunning=false; match.timerStartedAt=null;
  if(needsDecider(t,match)){
    if(t.sport==='hockey'){
      if(Math.random()<0.55){
        const w=Math.random()<eh/(eh+ea)?'h':'a';
        const team=w==='h'?home:away;
        if(w==='h')match.gh++; else match.ga++;
        match.events.push(mkEvent(t, team, V+1+rnd(5), true, w==='h'?redHpl:redApl));
        match.result='OT';
      } else {
        match.result='SO';
        match.penWinner=Math.random()<eh/(eh+ea)? home.id: away.id;
      }
    } else {
      match.result='PEN';
      match.penWinner=Math.random()<eh/(eh+ea)? home.id: away.id;
    }
  }
  match.status='done';
  genStats(t,match);
  autoMVP(t,match);
  onMatchDone(t,match);
}

/* --- Scorers table --- */
function scorersTable(t){
  const map={};
  t.matches.forEach(m=>{
    if(m.status!=='done') return;
    m.events.forEach(e=>{
      if(e.scorer!=null){
        const k=e.team+'#'+e.scorer;
        map[k]=map[k]||{team:e.team,n:e.scorer,g:0,a:0};
        map[k].g++;
      }
      if(e.assist!=null){
        const k=e.team+'#'+e.assist;
        map[k]=map[k]||{team:e.team,n:e.assist,g:0,a:0};
        map[k].a++;
      }
    });
  });
  return Object.values(map).sort((x,y)=> (y.g+y.a)-(x.g+x.a) || y.g-x.g);
}

/* --- Tournament factory --- */
function createTournament(cfg, db){
  const pool=db[cfg.sport].filter(x=>cfg.teamIds.includes(x.id)).map(x=>JSON.parse(JSON.stringify(x)));
  const t={
    id:uid(), name:cfg.name, sport:cfg.sport, created:Date.now(), status:'active', stage:'group',
    config:{ format:cfg.format, numGroups:cfg.numGroups||1, rounds:cfg.rounds||1, advance:cfg.advance||2,
             twoLeg:!!cfg.twoLeg, matchMode:cfg.matchMode, seeding:cfg.seeding||'rating' },
    teams:pool, groups:[], matches:[], bracket:null, champion:null, runnerUp:null, elo:{}, tactic:{}
  };
  pool.forEach(function(p){ const r=Math.random(); t.tactic[p.id]= r<0.22?'att' : r<0.40?'def' : 'bal'; });
  if(cfg.format==='cup'){
    t.stage='po';
    let seeds = cfg.seeding==='random'? shuffle(pool).map(x=>x.id)
               : pool.slice().sort((a,b)=>b.rating-a.rating).map(x=>x.id);
    t.bracket=buildBracket(seeds, cfg.twoLeg);
    t.bracket.ties.filter(x=>x.round===0).forEach(tie=>genTieMatches(t,tie));
  } else if(cfg.format==='league'){
    const ids=pool.map(x=>x.id);
    t.groups=[{name:'Таблица', teams:ids}];
    t.matches=genRoundRobin(shuffle(ids), cfg.rounds, 'group','Таблица');
  } else {
    const groups=drawGroups(pool, cfg.numGroups, cfg.seeding);
    const names='АБВГДЕЖЗ';
    groups.forEach((ids,i)=>{
      t.groups.push({name:names[i], teams:ids});
      t.matches.push(...genRoundRobin(ids, cfg.rounds, 'group', names[i]));
    });
  }
  return t;
}

function sortCol(th,type){
  const table=th.closest('table'); if(!table) return;
  const idx=th.cellIndex;
  const rows=[...table.querySelectorAll('tr')].filter(r=>r.children.length && r.children[0].tagName==='TD');
  if(rows.length<2) return;
  const dir=(th.getAttribute('data-dir')==='desc')?'asc':'desc';
  table.querySelectorAll('th').forEach(h=>{ h.removeAttribute('data-dir'); const s=h.querySelector('.sarr'); if(s) s.remove(); });
  th.setAttribute('data-dir',dir);
  const val=r=>{ const c=r.children[idx]; const tx=c?c.textContent.trim():''; if(type==='num'){ const m=tx.match(/-?\d+/); return m?parseInt(m[0],10):-Infinity; } return tx.toLowerCase(); };
  rows.sort((a,b)=>{ const x=val(a),y=val(b); return (x<y?-1:x>y?1:0)*(dir==='asc'?1:-1); });
  const p=rows[0].parentNode; rows.forEach((r,i)=>{ p.appendChild(r); const c0=r.children[0]; if(c0 && /^\d+$/.test(c0.textContent.trim())) c0.textContent=i+1; });
  const ar=document.createElement('span'); ar.className='sarr'; ar.textContent=dir==='asc'?' ▲':' ▼'; th.appendChild(ar);
}
function openTeam(tid,teamId){
  const t=tById(tid); if(!t) return; const tm=team(t,teamId); if(!tm) return;
  const ms=t.matches.filter(m=>m.status==='done'&&(m.home===teamId||m.away===teamId));
  let w=0,dr=0,l=0,gf=0,ga=0;
  ms.forEach(m=>{ const us=m.home===teamId?m.gh:m.ga, th=m.home===teamId?m.ga:m.gh; gf+=us; ga+=th; if(us>th)w++; else if(us<th)l++; else dr++; });
  const grp=t.groups.find(g=>g.teams.indexOf(teamId)>=0);
  let pos=null, pts=null;
  if(grp){ const tbl=computeTable(grp.teams, t.matches.filter(mm=>mm.stage==='group'&&mm.group===grp.name), t.sport); const idx=tbl.findIndex(x=>x.team===teamId); if(idx>=0){ pos=idx+1; pts=tbl[idx].pts; } }
  const map={};
  t.matches.forEach(m=>{ if(m.status!=='done')return;
    (m.events||[]).forEach(e=>{ if(e.team!==teamId)return; if(!e.type){ if(e.scorer!=null){ (map[e.scorer]=map[e.scorer]||{g:0,a:0,m:0}).g++; } if(e.assist!=null){ (map[e.assist]=map[e.assist]||{g:0,a:0,m:0}).a++; } } });
    if(m.mvp&&m.mvp.team===teamId){ (map[m.mvp.n]=map[m.mvp.n]||{g:0,a:0,m:0}).m++; } });
  const rows=Object.keys(map).map(n=>Object.assign({n:+n},map[n])).sort((a,b)=>(b.g+b.a)-(a.g+a.a)||b.g-a.g||b.m-a.m);

function drawSeq(t){
  const G=t.groups.length; if(!G) return [];
  const sorted=t.teams.slice().sort((a,b)=>b.rating-a.rating);
  const potOf={}; sorted.forEach((tm,i)=>potOf[tm.id]=Math.floor(i/G));
  const numPots=Math.ceil(t.teams.length/G); const seq=[];
  for(let p=0;p<numPots;p++) for(let gi=0;gi<G;gi++){ const grp=t.groups[gi]; const tid=grp.teams.find(id=>potOf[id]===p); if(tid) seq.push({teamId:tid,group:grp.name,gi:gi}); }
  return seq;
}

  h+='<div style="height:20px"></div>';
  return h;

function careerStats(teamId,n){

  (S.tournaments||[]).forEach(t=>{
    let played=false;
    (t.matches||[]).forEach(m=>{
      if(m.status!=='done') return;
      if(m.home===teamId||m.away===teamId) played=true;
      (m.events||[]).forEach(e=>{ if(e.team===teamId && !e.type){ if(e.scorer===n) g++; if(e.assist===n) a++; } });
      if(m.mvp && m.mvp.team===teamId && m.mvp.n===n) mMvp++;

function awardsData(t){
  const map={};
  const get=(teamId,n)=>{ const k=teamId+'#'+n; if(!map[k]){ const tm=team(t,teamId); const p=(tm&&tm.players.find(x=>x.n===n))||{n,name:'№'+n,pos:'?'}; map[k]={team:teamId,n,name:p.name,pos:p.pos,g:0,a:0,mvp:0,cs:0}; } return map[k]; };
  const hatTricks=[]; let biggest=null;
  t.matches.forEach(m=>{
    if(m.status!=='done') return;
    const per={};
    m.events.forEach(e=>{
      if(e.type) return;
      if(e.scorer!=null){ get(e.team,e.scorer).g++; const kk=e.team+'#'+e.scorer; per[kk]=(per[kk]||0)+1; }
      if(e.assist!=null){ get(e.team,e.assist).a++; }
    });
    Object.entries(per).forEach(([k,v])=>{ if(v>=3){ const [tid,n]=k.split('#'); hatTricks.push({team:tid,n:+n,goals:v}); } });
    if(m.mvp) get(m.mvp.team,m.mvp.n).mvp++;
    const gk=(tid)=>{ const tm=team(t,tid); const k=tm.players.find(p=>p.pos==='ВР'); return k?k.n:null; };
    if(m.ga===0){ const k=gk(m.home); if(k!=null) get(m.home,k).cs++; }
    if(m.gh===0){ const k=gk(m.away); if(k!=null) get(m.away,k).cs++; }
    const diff=Math.abs(m.gh-m.ga);
    if(diff>0 && (!biggest||diff>biggest.diff)) biggest={diff,m};
  });
  const gp={}, gconc={}; t.teams.forEach(tm=>{ gp[tm.id]=0; gconc[tm.id]=0; });
  t.matches.forEach(m=>{ if(m.status!=='done') return;
    if(gp[m.home]!=null){ gp[m.home]++; gconc[m.home]+=m.ga; }
    if(gp[m.away]!=null){ gp[m.away]++; gconc[m.away]+=m.gh; } });
  const gaAvg={}; Object.keys(gp).forEach(id=>{ gaAvg[id]=gp[id]? gconc[id]/gp[id] : 0; });
  Object.values(map).forEach(r=>{ r.score=r.g*2+r.a+r.mvp*3+r.cs*1.5; r.mp=gp[r.team]||0; });
  return {map, list:Object.values(map), hatTricks, biggest, gp, gaAvg};
}
function bestEleven(t,d){
  const form = t.sport==='hockey'? {'ВР':1,'ЗЩ':2,'НП':3} : {'ВР':1,'ЗЩ':4,'ПЗ':3,'НП':3};
  const ga=d.gaAvg||{};
  // полный пул всех игроков всех команд; защита/вратарь учитывают пропущенные командой
  const pool=[];
  t.teams.forEach(tm=>tm.players.forEach(p=>{ const r=d.map[tm.id+'#'+p.n];
    pool.push({team:tm.id,n:p.n,name:p.name,pos:p.pos, g:r?r.g:0,a:r?r.a:0,mvp:r?r.mvp:0,cs:r?r.cs:0,score:r?r.score:0, ga:ga[tm.id]||0}); }));
  const byPos={}; pool.forEach(r=>{ (byPos[r.pos]=byPos[r.pos]||[]).push(r); });
  const out=[];
  Object.keys(form).forEach(function(pos){ const cnt=form[pos];
    const arr=(byPos[pos]||[]).slice();
    if(pos==='ВР') arr.sort((a,b)=> (b.cs - b.ga*1.5 + b.score*0.3) - (a.cs - a.ga*1.5 + a.score*0.3));
    else if(pos==='ЗЩ') arr.sort((a,b)=> (b.score + b.cs*1.5 - b.ga*1.4) - (a.score + a.cs*1.5 - a.ga*1.4));
    else arr.sort((a,b)=>b.score-a.score||b.g-a.g);
    arr.slice(0,cnt).forEach(r=>out.push(Object.assign({posSlot:pos},r)));
  });
  return out;
}

function genStats(t,m){
  if(m.stats) return m.stats;
  const home=team(t,m.home), away=team(t,m.away), hk=t.sport==='hockey';
  const diff=home.rating-away.rating;
  let hp=Math.round(50 + diff*0.55 + 4 + (Math.random()*8-4)); hp=Math.max(30,Math.min(70,hp));
  function yof(team,ty){ return m.events.filter(e=>e.type===ty&&e.team===team).length; }
  function side(goals, share, tid){
    if(hk){
      const sot=goals+2+rnd(6); const shots=sot+6+rnd(14)+Math.round(share/6);
      return {shots, sot:Math.min(sot,shots), fo:share, hits:10+rnd(20), pim:2*(yof(tid,'rc')*5)+2*rnd(4)+yof(tid,'yc')*2};
    }
    const sot=goals+rnd(4)+(goals?0:1); const shots=sot+3+rnd(8)+Math.round(share/9);
    return {pos:share, shots, sot:Math.min(sot,shots), corners:2+rnd(6)+Math.round(share/16), fouls:7+rnd(11)+yof(tid,'yc'), offs:rnd(5)};
  }
  m.stats={ home: side(m.gh, hp, m.home), away: side(m.ga, 100-hp, m.away) };
  return m.stats;
}

function canReset(t,m){
  if(t.status==='finished' && m.stage==='group' && t.config.format!=='league') return false;
  if(m.stage==='group'){
    if(!t.bracket) return true;
    return t.matches.filter(x=>x.stage==='po').every(x=>x.status==='scheduled'&&x.events.length===0);
  }
  const tie=t.bracket.ties.find(x=>x.id===m.tieId);
  if(!tie.winner) return true;
  if(tie.round===t.bracket.numRounds-1) return true;
  const next=t.bracket.ties.find(x=>x.round===tie.round+1&&x.idx===Math.floor(tie.idx/2));
  return !next || next.matches.length===0 || next.matches.every(id=>{ const mm=t.matches.find(z=>z.id===id); return mm&&mm.status==='scheduled'&&mm.events.length===0; });
}
function resetMatch(tid,mid){
  const t=tById(tid), m=t.matches.find(x=>x.id===mid);
  if(!canReset(t,m)){ toast('Нельзя: следующий раунд уже начат'); return; }
  if(m.eloDelta!=null && t.elo){ t.elo[m.home]=(t.elo[m.home]||0)-m.eloDelta; t.elo[m.away]=(t.elo[m.away]||0)+m.eloDelta; }
  t.bestXI=null;
  if(m.stage==='group' && t.config.format==='league' && t.status==='finished'){
    t.status='active'; t.champion=null; t.finishedAt=null; t.celebrated=false;
  }
  if(m.stage==='group' && t.bracket){
    t.matches=t.matches.filter(z=>z.stage!=='po');
    t.bracket=null; t.stage='group';
  }
  if(m.stage==='po'){
    const tie=t.bracket.ties.find(x=>x.id===m.tieId);
    if(tie.winner){
      if(tie.round===t.bracket.numRounds-1){ t.status='active'; t.champion=null; t.runnerUp=null; t.finishedAt=null; t.celebrated=false; }
      else{
        const next=t.bracket.ties.find(x=>x.round===tie.round+1&&x.idx===Math.floor(tie.idx/2));
        if(next){
          t.matches=t.matches.filter(z=>!next.matches.includes(z.id));
          next.matches=[];
          if(tie.idx%2===0) next.home=null; else next.away=null;
        }
      }
      tie.winner=null;
      tie.matches.forEach(id=>{ const z=t.matches.find(q=>q.id===id); if(z&&z.id!==m.id&&z.penWinner){ z.penWinner=null; if(z.result==='PEN'||z.result==='SO') z.result='REG'; } });
    }
  }
  Object.assign(m,{status:'scheduled',gh:0,ga:0,events:[],result:null,penWinner:null,timerElapsed:0,timerRunning:false,timerStartedAt:null,otPending:false,mvp:null,virtMin:0,lineup:null,stats:null,penScore:null,subsUsed:null,eloDelta:null});
  save(); closeModal(); render(); toast('Матч сброшен');
}

function afterLive(){
  reqWake();

function curElapsed(m){ return Math.floor((m.timerElapsed||0) + (m.timerRunning&&m.timerStartedAt? (Date.now()-m.timerStartedAt)/1000 : 0)); }
let lastShownS=-1;
function startTick(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    const t=lvT(), m=lvM(); if(!m||!m.timerRunning) return;
    const s=curElapsed(m);
    if(s!==lastShownS && s%10===0){ if(m.timerStartedAt){ m.timerElapsed=(m.timerElapsed||0)+(Date.now()-m.timerStartedAt)/1000; m.timerStartedAt=Date.now(); } save(); }
    updTimer();
    const V=virtLen(t), Vend=matchVend(t,m);
    const limReal=t.config.matchMode.minutes*60, limEff=limReal*Vend/V, half=limReal/2;
    if(t.sport!=='hockey' && lastShownS<half && s>=half){ vibr(120); whistle(1); toast('Перерыв · '+Math.round(V/2)+"'"); }
    if(lastShownS<limEff && s>=limEff){ vibr([300,150,300]); whistle(3); toast('Финальный свисток!'); }
    lastShownS=s;
  },500);
}
function updTimer(){
  const t=lvT(), m=lvM(), el=document.getElementById('tmr'); if(!el) return;
  const V=virtLen(t), Vend=matchVend(t,m);
  const limReal=t.config.matchMode.minutes*60, limEff=limReal*Vend/V;
  const s=curElapsed(m);
  const minute=Math.max(1, Math.min(Vend, Math.ceil((s/limReal)*V)));
  const inStop=minute>V, stop=minute-V;
  el.innerHTML=(inStop? V+'<span class="added">+'+stop+'</span>' : minute)+'<span class="ap">\'</span>';
  const ring=document.getElementById('ring');
  if(ring) ring.style.setProperty('--p', Math.min(100, s/limEff*100));
  const ending = minute >= V - Math.round(V*0.115);
  const box=document.getElementById('livebox');
  [el,ring,box].forEach(x=>{ if(x) x.classList.toggle('ending', ending); });
  el.classList.toggle('over', s>=limEff);
  const vm=document.getElementById('vmin');
  if(vm){ vm.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); vm.classList.toggle('ending', ending); }
}
function togglePause(){
  const m=lvM();
  if(m.timerRunning){ m.timerElapsed=curElapsed(m); m.timerStartedAt=null; m.timerRunning=false; }
  else { m.timerStartedAt=Date.now(); m.timerRunning=true; lastShownS=curElapsed(m); }
  save();
  const pp=document.getElementById('pp');
  pp.textContent=m.timerRunning?'⏸':'▶';
  pp.classList.toggle('paused', !m.timerRunning);
  if(m.timerRunning) startTick(); else clearInterval(timerInt);
}
/* виртуальная минута: реальное время масштабируется к 90'/60' */
function curMinute(){
  const t=lvT(), m=lvM(), V=virtLen(t);
  if(t.config.matchMode.type==='time'){
    const lim=t.config.matchMode.minutes*60, Vend=matchVend(t,m);
    return Math.max(1, Math.min(Vend, Math.ceil(((curElapsed(m)||1)/lim)*V)));
  }
  return m.virtMin||0;
}
function goal(teamId, scorerN){
  const t=lvT(), m=lvM();
  if(m.status==='done'){ toast('Матч завершён'); return; }
  if(scorerN!=null && m.events.some(e=>e.type==='rc'&&e.team===teamId&&e.pl===scorerN)){ toast('🟥 Игрок удалён'); return; }
  if(scorerN!=null && suspendedFor(t,teamId,m.id).has(scorerN)){ toast('🚫 Игрок дисквалифицирован'); return; }
  vibr(40);
  if(scorerN==null){ addGoal(teamId,null,null); return; }
  const tm=team(t,teamId);
  const sc=tm.players.find(p=>p.n===scorerN);
  const order={'ПЗ':0,'НП':1,'ЗЩ':2,'ВР':3};
  const others=tm.players.filter(p=>p.n!==scorerN).sort((a,b)=>(order[a.pos]??4)-(order[b.pos]??4)||a.n-b.n);
  let h='<h3>'+(t.sport==='hockey'?'🏒':'⚽')+' Гол! <b>'+esc(sc.name)+'</b></h3><p class="muted" style="margin:4px 0 10px">Кто отдал передачу?</p>'+
    '<div class="row" style="margin-bottom:8px"><div class="btn grow" onclick="addGoal(\''+teamId+'\','+scorerN+',null);closeModal()">Без передачи</div>'+
    '<div class="btn danger" onclick="closeModal()">Отмена</div></div><div class="pgrid">';
  others.forEach(p=>{
    h+='<button class="pbtn" onclick="addGoal(\''+teamId+'\','+scorerN+','+p.n+');closeModal()">'+
      ava(tm,p)+'<span class="num">'+p.n+'</span><span class="nm">'+esc(shortName(p.name))+'</span></button>';
  });
  h+='</div>';
  showModal(h);
}
function addGoal(teamId,scorerN,assistN,pen){
  const t=lvT(), m=lvM(), V=virtLen(t);
  let min;
  if(t.config.matchMode.type==='time') min=curMinute();
  else { m.virtMin=Math.min(V, (m.virtMin||0)+3+rnd(14)); min=m.virtMin; }
  const ev={team:teamId, scorer:scorerN, assist:assistN, min:min};
  if(pen) ev.pen=true;
  if(m.otPending){ ev.ot=true; ev.min=V+1+rnd(t.sport==='hockey'?5:30); }
  m.events.push(ev);
  recountScore(m);
  crowdRoar();
  save();
  if(m.otPending){ finishMatch('OT'); return; }
  refreshLiveScore(teamId===m.home?'sh':'sa');
  const mm=t.config.matchMode;
  if(mm.type==='goals' && (m.gh>=mm.goals||m.ga>=mm.goals)){
    setTimeout(()=>tryFinish(),250);
  }
}
function recountScore(m){
  m.gh=m.events.filter(e=>e.team===m.home && !e.type).length;
  m.ga=m.events.filter(e=>e.team===m.away && !e.type).length;
}
function refreshLiveScore(popId){
  const m=lvM();
  const sh=document.getElementById('sh'), sa=document.getElementById('sa');
  if(sh){sh.textContent=m.gh; sa.textContent=m.ga;}
  if(popId){ const el=document.getElementById(popId); if(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } }
  const f=document.getElementById('feed'); if(f) f.innerHTML=feedHtml(lvT(),m);
  if(lvT().config.matchMode.type==='time'){ updTimer(); } else { const vm=document.getElementById('vmin'); if(vm) vm.textContent=curMinute()+'\''; }
}

function subTeam(teamId){
  const t=lvT(), m=lvM(); ensureLineup(t,m);

  if(used>=max){ toast('Лимит замен ('+max+')'); return; }

    xi.map(p=>'<button class="pbtn" onclick="subOff(\''+teamId+'\','+p.n+')">'+ava(tm,p)+'<span class="num">'+p.n+'</span><span class="nm">'+esc(shortName(p.name))+'</span><span class="pos">'+p.pos+'</span></button>').join('')+

function subOff(teamId,offN){
  const t=lvT(), m=lvM(), tm=team(t,teamId), side=teamId===m.home?m.lineup.home:m.lineup.away;
  if(!side.bench.length){ toast('Скамейка пуста'); return; }
  SUB={teamId,off:offN};
  const order={'ВР':0,'ЗЩ':1,'ПЗ':2,'НП':3};
  const bench=side.bench.map(n=>tm.players.find(p=>p.n===n)).filter(Boolean).sort((a,b)=>(order[a.pos]??4)-(order[b.pos]??4)||a.n-b.n);
  let h='<h3>Кто выходит вместо '+esc(playerName(t,teamId,offN))+'?</h3><div class="pgrid">'+
    bench.map(p=>'<button class="pbtn" onclick="subDo('+p.n+')">'+ava(tm,p)+'<span class="num">'+p.n+'</span><span class="nm">'+esc(shortName(p.name))+'</span><span class="pos">'+p.pos+'</span></button>').join('')+
    '</div><div class="btn wide" style="margin-top:8px" onclick="subTeam(\''+teamId+'\')">‹ Назад</div>';

function subDo(onN){
  const t=lvT(), m=lvM(); if(!SUB) return; const teamId=SUB.teamId, offN=SUB.off;
  const max=t.sport==='hockey'?6:5; if(((m.subsUsed&&m.subsUsed[teamId])||0)>=max){ toast('Лимит замен ('+max+')'); SUB=null; closeModal(); return; }
  const side=teamId===m.home?m.lineup.home:m.lineup.away;
  const oi=side.xi.indexOf(offN); if(oi<0){ SUB=null; closeModal(); return; }
  side.xi[oi]=onN; side.bench=side.bench.filter(n=>n!==onN); side.bench.push(offN);
  m.subsUsed=m.subsUsed||{}; m.subsUsed[teamId]=(m.subsUsed[teamId]||0)+1;
  const min=t.config.matchMode.type==='time'?curMinute():(m.virtMin||0);
  m.events.push({team:teamId,type:'sub',on:onN,off:offN,min:min});
  save(); closeModal(); SUB=null;
  toast('🔄 '+playerName(t,teamId,onN)+' ← '+playerName(t,teamId,offN)); vibr(25);
  render();
}

function penShoot(zone){

  const sk=(skillOf(shooter)-0.65)/1.25;
  const keeperZone=penKeeperPick();
  let res;
  if(Math.random() < PEN_OFF[zone]*(1-0.4*sk)) res='miss';

    if(side==='h'){ PEN.htaken++; if(res==='goal')PEN.hgoals++; PEN.hlog.push(res); }
    else { PEN.ataken++; if(res==='goal')PEN.agoals++; PEN.alog.push(res); }

  void ball.offsetWidth;
  ball.style.transition='left .42s cubic-bezier(.3,.7,.4,1), top .42s cubic-bezier(.3,.7,.4,1), transform .42s';
  ball.style.left=((zr.left-fr.left)+zr.width/2)+'px';
  ball.style.top=((zr.top-fr.top)+zr.height/2)+'px';
  ball.style.transform='translate(-50%,-50%) scale(.8)';
  const kx=((kr.left-fr.left)+kr.width/2)-(fr.width/2);
  keep.style.transition='transform .34s cubic-bezier(.2,.8,.2,1)';
  keep.style.transform='translate('+(kx*0.66)+'px,'+((keeperZone<3?-18:keeperZone>5?8:-6))+'px) rotate('+(kx>4?20:kx<-4?-20:0)+'deg)';

function sndOn(){ return S.sound!==false; }

function crowdRoar(){ if(!sndOn()) return; try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const dur=1.3, sr=ctx.sampleRate, buf=ctx.createBuffer(1, Math.floor(sr*dur), sr), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*(0.6+0.4*Math.sin(i/4000)); }
  const srcn=ctx.createBufferSource(); srcn.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.6;
  const g=ctx.createGain(); const t0=ctx.currentTime;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.5,t0+0.22); g.gain.linearRampToValueAtTime(0.30,t0+0.7); g.gain.linearRampToValueAtTime(0,t0+dur);
  srcn.connect(bp); bp.connect(g); g.connect(ctx.destination); srcn.start(); srcn.stop(t0+dur);
}catch(e){} }

 {id:'rout',ic:'💥',t:'Разгром',d:'Победа в 5+ мячей',f:s=>s.tournaments.some(t=>t.matches.some(m=>m.status==='done'&&Math.abs(m.gh-m.ga)>=5))},
 {id:'g100',ic:'⚽',t:'Сотня',d:'100 голов суммарно',f:s=>totalGoals(s)>=100},
 {id:'pred',ic:'🎯',t:'Оракул',d:'30 очков прогнозов',f:s=>(s.tournaments||[]).reduce((a,t)=>a+predStats(t).pts,0)>=30},
 {id:'both',ic:'🏒',t:'Универсал',d:'Выиграй футбол и хоккей',f:s=>s.tournaments.some(t=>t.status==='finished'&&t.sport==='football')&&s.tournaments.some(t=>t.status==='finished'&&t.sport==='hockey')}
];
function checkAch(){ S.ach=S.ach||{}; const got=[]; ACH.forEach(a=>{ if(!S.ach[a.id]){ try{ if(a.f(S)){ S.ach[a.id]=Date.now(); got.push(a); } }catch(e){} } }); if(got.length){ save(); got.forEach((a,i)=> setTimeout(()=>toast(a.ic+' Достижение: '+a.t), 500+i*1100)); } }
function achievementsHtml(){ S.ach=S.ach||{};
  let h='<h2>🏅 Достижения · '+Object.keys(S.ach).length+'/'+ACH.length+'</h2><div class="card">';
  ACH.forEach(a=>{ const ok=!!S.ach[a.id];
    h+='<div class="award" style="opacity:'+(ok?1:.45)+'"><div class="ic">'+a.ic+'</div><div class="grow"><div class="ttl">'+esc(a.t)+'</div><div class="muted" style="font-size:11px">'+esc(a.d)+'</div></div><div class="awx">'+(ok?'✅':'🔒')+'</div></div>'; });
  return h+'</div>';
}
function globalRecords(){
  const pl={}; const get=(tid,n,nm)=>{ const k=tid+'#'+n; if(!pl[k]) pl[k]={team:tid,n:n,name:nm,g:0,mvpM:0,xi:0}; return pl[k]; };
  (S.tournaments||[]).forEach(t=>{
    t.matches.forEach(m=>{ if(m.status!=='done')return;
      m.events.forEach(e=>{ if(!e.type&&e.scorer!=null){ const r=get(e.team,e.scorer,playerName(t,e.team,e.scorer)); r.g++; } });
      if(m.mvp){ const r=get(m.mvp.team,m.mvp.n,playerName(t,m.mvp.team,m.mvp.n)); r.mvpM++; } });
    if(t.status==='finished'){ (t.bestXI||[]).forEach(x=>{ const r=get(x.team,x.n,playerName(t,x.team,x.n)); r.xi++; }); }
  });
  const arr=Object.values(pl);
  return { scorers:arr.filter(r=>r.g>0).sort((a,b)=>b.g-a.g).slice(0,8), mvps:arr.filter(r=>r.mvpM>0).sort((a,b)=>b.mvpM-a.mvpM).slice(0,5) };
}
function globalRecordsHtml(){
  const g=globalRecords(); let h='';
  function tbl(rows,lbl,key){ if(!rows.length) return ''; let s='<div class="card" style="padding:6px 10px"><table><tr><th></th><th class="tname">'+lbl+'</th><th>'+(key==='g'?'Г':'N')+'</th></tr>';
    rows.forEach((r,i)=>{ const tm=TEAM_INDEX[r.team]; s+='<tr onclick="openPlayer(\''+r.team+'\','+r.n+')" style="cursor:pointer"><td class="muted">'+(i+1)+'</td><td class="tname"><span class="row" style="gap:6px">'+(tm?tLogo(tm):'')+'<span>'+esc(r.name)+'</span></span></td><td><b>'+(key==='g'?r.g:r.mvpM)+'</b></td></tr>'; });
    return s+'</table></div>'; }
  if(g.scorers.length||g.mvps.length){ h+='<h2>📈 Рекорды всех турниров</h2>'+tbl(g.scorers,'⚽ Бомбардиры','g')+tbl(g.mvps,'⭐ MVP матчей','m'); }
  return h;
}
function rHall(){
  const fin=S.tournaments.filter(t=>t.status==='finished').sort((a,b)=>b.finishedAt-a.finishedAt);
  let h='<div class="hdr"><div class="back" onclick="go({name:\'home\'})">‹</div><h1 class="grow" style="margin:0">🏅 Зал славы</h1></div>';
  h+=achievementsHtml();
  if(!fin.length) return h+'<div class="empty">Заверши первый турнир — здесь появятся титулы и рекорды</div>';
  h+=globalRecordsHtml();
  const cnt={};
  fin.forEach(t=>{ const c=team(t,t.champion); cnt[c.id]=cnt[c.id]||{tm:c,n:0}; cnt[c.id].n++; });
  const top=Object.values(cnt).sort((a,b)=>b.n-a.n);
  h+='<h2>Титулы</h2><div class="card" style="padding:6px 10px"><table>';
  top.forEach((r,i)=>{ h+='<tr><td class="muted">'+(i+1)+'</td><td class="tname"><span class="row" style="gap:6px">'+
    tLogo(r.tm)+'<span>'+esc(r.tm.name)+'</span></span></td>'+
    '<td style="text-align:right">'+'🏆'.repeat(Math.min(r.n,8))+(r.n>8?' ×'+r.n:'')+'</td></tr>'; });
  h+='</table></div>';
  h+='<h2>История</h2>';
  fin.forEach(t=>{
    const c=team(t,t.champion); const mvp=tournamentMVP(t);
    h+='<div class="card tap" onclick="openT(\''+t.id+'\')"><div class="row">'+
      '<div style="font-size:20px">'+(t.sport==='hockey'?'🏒':'⚽')+'</div>'+
      '<div class="grow"><b>'+esc(t.name)+'</b><div class="muted">'+new Date(t.finishedAt).toLocaleDateString('ru')+'</div></div>'+
      '<div style="text-align:right"><div class="row" style="justify-content:flex-end;gap:5px">🏆 '+tLogo(c)+' <b>'+esc(c.name)+'</b></div>'+
      (mvp?'<div class="muted" style="font-size:11px">⭐ '+esc(playerName(t,mvp.team,mvp.n))+'</div>':'')+'</div></div></div>';
  });
  return h;
}

function setupPWA(){
  try{
    const sz=512, c=document.createElement('canvas'); c.width=c.height=sz; const x=c.getContext('2d');
    const rr=(X,Y,w,h,r)=>{ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); };
    x.fillStyle='#070a10'; x.fillRect(0,0,sz,sz);
    const g=x.createLinearGradient(0,0,sz,sz); g.addColorStop(0,'#34d399'); g.addColorStop(.6,'#22d3ee'); g.addColorStop(1,'#3b82f6');
    x.fillStyle=g; rr(46,46,sz-92,sz-92,96); x.fill();
    x.textAlign='center'; x.textBaseline='middle'; x.font='280px serif'; x.fillText('🏆',sz/2,sz/2+16);
    const icon=c.toDataURL('image/png');
    const add=(tag,attrs)=>{ const el=document.createElement(tag); for(const k in attrs) el[k]=attrs[k]; document.head.appendChild(el); };
    add('link',{rel:'apple-touch-icon',href:icon});
    add('meta',{name:'apple-mobile-web-app-title',content:'My Worldcup'});
    add('meta',{name:'apple-mobile-web-app-status-bar-style',content:'black-translucent'});
    const manifest={ name:'My Worldcup', short_name:'Worldcup', start_url:'.', scope:'.', display:'standalone',
      orientation:'portrait', background_color:'#070a10', theme_color:'#070a10', lang:'ru',
      icons:[ {src:icon,sizes:'512x512',type:'image/png',purpose:'any'}, {src:icon,sizes:'512x512',type:'image/png',purpose:'maskable'} ] };
    const url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    add('link',{rel:'manifest',href:url});
  }catch(e){}
}
function _persistTimer(){ try{ if(view&&view.name==='live'){ const m=lvM(); if(m&&m.timerRunning){ m.timerElapsed=curElapsed(m); m.timerStartedAt=Date.now(); save(); } } }catch(e){} }
window.addEventListener('visibilitychange',function(){ if(document.hidden) _persistTimer(); });
window.addEventListener('beforeunload', _persistTimer);
render();
setupPWA();
checkAch();
setTimeout(cacheLogosBg, 1500);
setTimeout(()=>{ try{ const ids=[...new Set(S.tournaments.flatMap(t=>(t.teams||[]).map(x=>x.id)))]; cachePhotosBg(ids); }catch(e){} }, 4000);
</script>
